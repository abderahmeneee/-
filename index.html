<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>حرفي – خدمات منزلية وحرفية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#14162b;--mut:#6a6f8f;--line:#e3e5f1;--p:#4f46e5;--p2:#7c3aed;--a:#f59e0b;--ok:#16a34a;--r:#ef4444;--in:#eef0fa;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f1f;--card:#171932;--tx:#f1f2ff;--mut:#9a9fcb;--line:#262a4a;--in:#1e2140;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0f1f;--card:#171932;--tx:#f1f2ff;--mut:#9a9fcb;--line:#262a4a;--in:#1e2140;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{min-height:100%;background:var(--bg);color:var(--tx);font-family:'Tajawal',Tahoma,Arial,sans-serif;display:flex;justify-content:center}
a{color:inherit;text-decoration:none}
#app{width:100%;max-width:520px;padding:14px 16px 110px}
h1{font-size:23px;font-weight:800;line-height:1.35}h2{font-size:18px;font-weight:800;margin:20px 0 10px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.mut{color:var(--mut);font-size:13px}
.hero{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:26px;padding:18px;box-shadow:0 12px 30px #4f46e540}
.hero .mut{color:#ffffffcc}
.in{width:100%;background:var(--in);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:13px;font:500 16px inherit;font-family:inherit;margin:6px 0 12px}
.hero .in{margin:14px 0 0;border:0;background:#fff;color:#14162b}
.ib{background:#ffffff2e;border:0;border-radius:12px;width:42px;height:42px;font-size:19px;color:#fff;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 4px;text-align:center;font-size:12.5px;font-weight:700}
.cat span{display:block;font-size:27px;margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
.pc{display:flex;gap:12px;align-items:center;cursor:pointer}
.av{width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,#e0e7ff,#ede9fe);display:grid;place-items:center;font-size:26px;flex:none}
.nm{font-weight:800;font-size:16px}.ok{color:var(--p);font-size:13px}
.star{color:var(--a);font-weight:800}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.chip{padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:700;cursor:pointer;color:var(--tx)}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font:800 16px inherit;font-family:inherit;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));cursor:pointer;text-align:center}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn.sm{width:auto;padding:9px 14px;font-size:13.5px;border-radius:12px;display:inline-block}
.btn.w{background:#16a34a}.btn.d{background:var(--r)}
.fav{background:none;border:0;font-size:21px;cursor:pointer}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav div{display:flex;width:100%;max-width:520px}
.nav a{flex:1;text-align:center;padding:9px 0 8px;font-size:11.5px;font-weight:700;color:var(--mut)}
.nav a span{display:block;font-size:21px}.nav a.on{color:var(--p)}
.cta{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.cta div{max-width:520px;margin:auto;display:flex;gap:10px;align-items:center}
.pill{display:inline-block;padding:3px 10px;border-radius:10px;font-size:12px;font-weight:800;background:#e0e7ff;color:#4338ca}
.pill.ok2{background:#dcfce7;color:#166534}.pill.no{background:#fee2e2;color:#991b1b}.pill.dn{background:#f1f5f9;color:#475569}
.li{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}
.promo{background:linear-gradient(90deg,#f59e0b,#fb923c);color:#2a1700;border-radius:18px;padding:14px;margin:16px 0 4px;font-weight:800}
.ov{position:fixed;inset:0;background:#000a;z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:520px;background:var(--card);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;z-index:20;max-width:90%}
label{font-size:13px;color:var(--mut);font-weight:700}
.back{background:var(--card);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;font-size:18px;cursor:pointer;color:var(--tx)}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav"></nav>
<div id="ov"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=n=>Math.round(n).toLocaleString('en-US');
let S={name:'',phone:'',addr:'',fav:[],bk:[],rv:{},theme:''},q='',sort='r',ot='up';
try{Object.assign(S,JSON.parse(localStorage.getItem('harfi')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('harfi',JSON.stringify(S))}catch(e){}};
if(S.theme)document.documentElement.dataset.theme=S.theme;
const CATS=[['plumb','سباكة','🚰'],['elec','كهرباء','💡'],['clean','تنظيف','🧼'],['paint','دهان','🎨'],['wood','نجارة','🪚'],['ac','تكييف','❄️'],['weld','حدادة','🔩'],['furn','تركيب أثاث','🛋️'],['pest','مكافحة حشرات','🐜'],['move','نقل أثاث','🚚'],['garden','بستنة','🌿'],['appl','صيانة أجهزة','🔧']];
const CI=Object.fromEntries(CATS.map(c=>[c[0],c]));
const P=[
[1,'كريم بن علي','plumb',4.9,312,1500,12,1,'سبّاك محترف في كشف التسريبات وتركيب الحمامات والمطابخ.','كشف تسريب:1500|تركيب حنفية:1200|تسليك مجاري:2500|تركيب حمام كامل:12000'],
[2,'ياسين بوعلام','plumb',4.6,148,1200,6,0,'إصلاح سريع لأعطال المياه والسخانات.','إصلاح سخان:1800|تغيير أنابيب:3500|تركيب مرحاض:2500'],
[3,'سمير حمدي','elec',4.8,276,1000,10,1,'كهربائي معتمد: تمديدات وإنارة ولوحات توزيع.','فحص كهرباء:1000|تركيب إنارة:1500|تغيير لوحة:6000|تمديد غرفة:9000'],
[4,'نور الدين مرزوق','elec',4.5,93,900,4,0,'أعطال الكهرباء المنزلية وتركيب المآخذ.','تركيب مأخذ:800|إصلاح عطل:1500'],
[5,'فريق نقاء','clean',4.9,421,3500,8,1,'تنظيف شامل للمنازل والمكاتب بمعدات حديثة.','تنظيف شقة:3500|تنظيف بعد البناء:9000|تنظيف أرائك:2500'],
[6,'وردة بلعربي','clean',4.7,167,2500,5,1,'تنظيف منزلي دقيق وتعقيم المطابخ.','تنظيف مطبخ:2500|تنظيف يومي:3000'],
[7,'أمين لوني','paint',4.7,204,6000,9,1,'دهان داخلي وخارجي وديكورات الجبس.','دهان غرفة:6000|دهان شقة:35000|ديكور جبس:15000'],
[8,'عبد القادر نجّار','wood',4.8,131,2000,15,1,'تفصيل أبواب وخزائن مطابخ وإصلاح الأثاث.','إصلاح باب:2000|تفصيل خزانة:25000|مطبخ كامل:90000'],
[9,'هشام للتكييف','ac',4.8,338,2500,7,1,'تركيب وصيانة وشحن غاز المكيفات.','صيانة مكيف:2500|شحن غاز:4000|تركيب مكيف:6500'],
[10,'رضا الحدّاد','weld',4.6,87,3000,11,0,'أبواب وشبابيك حديد وإصلاح الأسوار.','إصلاح باب حديد:3000|تركيب شباك:7000'],
[11,'مصطفى للتركيب','furn',4.7,245,1500,6,1,'تركيب أثاث ومطابخ جاهزة بدقة.','تركيب خزانة:2000|تركيب غرفة نوم:5000|تركيب مطبخ:9000'],
[12,'الأمان للمكافحة','pest',4.6,119,3500,8,1,'مكافحة الحشرات والقوارض بمواد آمنة.','رش شقة:3500|مكافحة صراصير:4500|ضمان 6 أشهر:7000'],
[13,'نقل الأخوين','move',4.5,302,8000,10,1,'نقل أثاث مع فك وتركيب وتغليف.','نقل شقة صغيرة:8000|نقل شقة كبيرة:18000'],
[14,'جنّة للحدائق','garden',4.8,74,2500,7,1,'تنسيق حدائق وتقليم وري آلي.','تقليم:2500|تنسيق حديقة:12000|ري آلي:15000'],
[15,'توفيق للأجهزة','appl',4.7,258,1500,9,1,'صيانة غسالات وثلاجات وأفران.','فحص جهاز:1500|إصلاح غسالة:3500|إصلاح ثلاجة:4500']
].map(a=>({id:a[0],n:a[1],c:a[2],r:a[3],j:a[4],p:a[5],y:a[6],v:a[7],b:a[8],ph:'0550000000',s:a[9].split('|').map(x=>{const[t,pr]=x.split(':');return{t,p:+pr}})}));
const PI=Object.fromEntries(P.map(p=>[p.id,p]));
const RV=[['أحمد','وصل في الموعد وأنجز العمل بإتقان.'],['سارة','تعامل راقٍ وسعر عادل، أنصح به.'],['محمد','سريع ونظيف في العمل.']];
const stars=r=>'★'.repeat(Math.round(r))+'☆'.repeat(5-Math.round(r));
const ST={pending:['قيد التأكيد',''],conf:['مؤكد','ok2'],done:['منتهي','dn'],canc:['ملغي','no']};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=tr(m);document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function sheet(h){$('ov').innerHTML=`<div class="ov" onclick="if(event.target===this)closeS()"><div class="sh">${h}</div></div>`}
function closeS(){$('ov').innerHTML=''}
function tog(){const d=document.documentElement.dataset.theme,dark=d?d==='dark':matchMedia('(prefers-color-scheme: dark)').matches;S.theme=dark?'light':'dark';document.documentElement.dataset.theme=S.theme;save()}
function pc(p){const c=CI[p.c],n=p.j+(S.rv[p.id]||[]).length;return `<div class="card pc" onclick="location.hash='#/p/${p.id}'"><div class="av">${c[2]}</div><div style="flex:1"><div class="nm">${esc(p.n)} ${p.v?'<span class="ok">✔ موثّق</span>':''}</div><div class="mut"><span class="star">★ ${p.r}</span> (${n}) · خبرة ${p.y} سنة</div><div class="mut">${c[1]} · من <b style="color:var(--tx)">${f(p.p)} دج</b></div></div><button class="fav" onclick="event.stopPropagation();fv(${p.id})">${S.fav.includes(p.id)?'❤️':'🤍'}</button></div>`}
function fv(id){S.fav=S.fav.includes(id)?S.fav.filter(x=>x!==id):[...S.fav,id];save();route()}
function body(){const top=[...P].sort((a,b)=>b.r-a.r).slice(0,5);
return `<div class="promo">🎁 خصم 10% على أول حجز لك!</div><h2>الخدمات</h2><div class="grid">${CATS.map(c=>`<a class="cat" href="#/c/${c[0]}"><span>${c[2]}</span>${c[1]}</a>`).join('')}</div><h2>الأعلى تقييماً ⭐</h2>${top.map(pc).join('')}<p class="mut" style="text-align:center;margin-top:10px">البيانات المعروضة تجريبية لأغراض العرض.</p>`}
function results(){const k=q.trim(),l=P.filter(p=>{const t=p.n+' '+CI[p.c][1]+' '+p.b+' '+p.s.map(s=>s.t).join(' ');return (t+' '+tr(t,'fr')+' '+tr(t,'en')).toLowerCase().includes(k.toLowerCase())});return l.length?l.map(pc).join(''):'<div class="card mut" style="text-align:center">لا توجد نتائج مطابقة.</div>'}
function srch(v){q=v;$('res').innerHTML=q.trim()?results():body()}
function home(){return `<div class="hero"><div class="row sp"><div><div class="mut">مرحباً${S.name?' '+esc(S.name):' بك'} 👋</div><h1>ماذا تريد أن نصلح اليوم؟</h1></div><div class="row" style="gap:6px"><button class="ib" onclick="nextLang()">🌐</button><button class="ib" onclick="tog()">🌓</button></div></div><input class="in" placeholder="ابحث عن خدمة أو حرفي…" value="${esc(q)}" oninput="srch(this.value)"></div><div id="res">${q.trim()?results():body()}</div>`}
function cat(id){const c=CI[id];if(!c)return home();const l=P.filter(p=>p.c===id).sort((a,b)=>sort==='p'?a.p-b.p:sort==='y'?b.y-a.y:b.r-a.r);
return `<div class="row"><button class="back" onclick="history.back()">${ba()}</button><h1>${c[2]} ${c[1]}</h1></div><div class="chips" style="margin-top:14px">${[['r','الأفضل تقييماً'],['p','الأرخص'],['y','الأكثر خبرة']].map(x=>`<span class="chip ${sort===x[0]?'on':''}" onclick="sort='${x[0]}';route()">${x[1]}</span>`).join('')}</div>${l.map(pc).join('')}`}
function prof(id){const p=PI[id];if(!p)return home();const c=CI[p.c],mine=S.rv[id]||[];
return `<div class="row sp"><button class="back" onclick="history.back()">${ba()}</button><button class="fav" onclick="fv(${id})">${S.fav.includes(id)?'❤️':'🤍'}</button></div>
<div class="card" style="text-align:center;margin-top:12px"><div class="av" style="margin:0 auto 10px;width:76px;height:76px;font-size:38px">${c[2]}</div><h1>${esc(p.n)}</h1><div class="mut">${c[1]} ${p.v?'· <span class="ok">✔ موثّق</span>':''}</div><div class="row" style="justify-content:center;margin-top:12px;gap:22px"><div><b class="star">★ ${p.r}</b><div class="mut">التقييم</div></div><div><b>${p.j+mine.length}</b><div class="mut">عمل منجز</div></div><div><b>${p.y}</b><div class="mut">سنة خبرة</div></div></div></div>
<div class="row" style="margin-bottom:12px"><button class="btn s" onclick="toast('رقم تجريبي: يُربط برقم الحرفي الفعلي عند الإطلاق')">📞 اتصال</button><button class="btn w" onclick="toast('رقم تجريبي: يُربط برقم الحرفي الفعلي عند الإطلاق')">💬 واتساب</button></div>
<div class="card"><b>نبذة</b><p class="mut" style="margin-top:6px;line-height:1.8">${esc(p.b)}</p></div>
<div class="card"><b>الخدمات والأسعار</b>${p.s.map(s=>`<div class="li"><span>${esc(s.t)}</span><b>${f(s.p)} دج</b></div>`).join('')}<p class="mut" style="margin-top:6px">الأسعار تقديرية وتُؤكَّد بعد المعاينة.</p></div>
<div class="card"><b>آراء العملاء</b>${[...mine.map(r=>[S.name||'أنت',r.c,r.s]),...RV.map((r,i)=>[r[0],r[1],5-(i%2)])].map(r=>`<div class="li" style="display:block"><div class="row sp"><b>${esc(r[0])}</b><span class="star">${stars(r[2])}</span></div><div class="mut">${esc(r[1]||'')}</div></div>`).join('')}</div>
<div class="cta"><div><div style="flex:1"><div class="mut">ابتداءً من</div><b style="font-size:18px">${f(p.p)} دج</b></div><button class="btn" style="flex:2" onclick="location.hash='#/b/${id}'">احجز الآن</button></div></div>`}
let B={};
function dates(){return Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()+i);return{k:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),l:i===0?'اليوم':i===1?'غداً':d.toLocaleDateString(LOC(),{weekday:'short',day:'numeric'})}})}
const TIMES=['08:00','10:00','12:00','14:00','16:00','18:00'];
function book(id){const p=PI[id];if(!p)return home();if(B.pid!==id)B={pid:id,s:0,d:dates()[1].k,t:'10:00'};const sv=p.s[B.s],disc=S.bk.length?0:.1,tot=sv.p*(1-disc);
return `<div class="row"><button class="back" onclick="history.back()">${ba()}</button><h1>حجز: ${esc(p.n)}</h1></div>
<h2>الخدمة</h2><div class="chips">${p.s.map((s,i)=>`<span class="chip ${B.s===i?'on':''}" onclick="B.s=${i};route()">${esc(s.t)}</span>`).join('')}</div>
<h2>اليوم</h2><div class="chips">${dates().map(d=>`<span class="chip ${B.d===d.k?'on':''}" onclick="B.d='${d.k}';route()">${d.l}</span>`).join('')}</div>
<h2>الوقت</h2><div class="chips">${TIMES.map(t=>`<span class="chip ${B.t===t?'on':''}" onclick="B.t='${t}';route()">${t}</span>`).join('')}</div>
<h2>بيانات الموقع</h2><label>العنوان</label><input class="in" id="ba" value="${esc(S.addr)}" placeholder="الحي، الشارع، رقم البناية"><label>رقم الهاتف</label><input class="in" id="bp" type="tel" inputmode="tel" value="${esc(S.phone)}"><label>ملاحظات (اختياري)</label><input class="in" id="bn" placeholder="وصف المشكلة">
<div class="card"><div class="li"><span>${esc(sv.t)}</span><b>${f(sv.p)} دج</b></div>${disc?`<div class="li"><span>خصم أول حجز 10%</span><b style="color:var(--ok)">−${f(sv.p*disc)} دج</b></div>`:''}<div class="li"><b>الإجمالي التقديري</b><b style="color:var(--p);font-size:18px">${f(tot)} دج</b></div></div>
<div class="cta"><div><button class="btn" onclick="confirmB()">تأكيد الحجز</button></div></div>`}
function confirmB(){const a=$('ba').value.trim(),ph=$('bp').value.trim(),p=PI[B.pid];if(!a||ph.length<8){toast('أدخل العنوان ورقم هاتف صحيحاً');return}
S.addr=a;S.phone=ph;const sv=p.s[B.s];S.bk.unshift({id:Date.now(),pid:p.id,svc:sv.t,price:sv.p*(S.bk.length?1:.9),d:B.d,t:B.t,a,ph,n:$('bn').value.trim(),st:'pending',c:Date.now()});save();B={};toast('✅ تم إرسال طلب الحجز');location.hash='#/orders'}
function orders(){const now=Date.now();S.bk.forEach(b=>{if(b.st==='pending'&&now-b.c>30000&&!S.pmu)b.st='conf'});save();
const L=S.bk.filter(b=>ot==='up'?['pending','conf'].includes(b.st):['done','canc'].includes(b.st));

function walk(n){if(n.nodeType===3){if(AR.test(n.nodeValue)){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}return}
if(n.nodeType!==1||n.tagName==='SCRIPT'||n.tagName==='STYLE')return;const ph=n.getAttribute('placeholder');if(ph&&AR.test(ph))n.setAttribute('placeholder',tr(ph));n.childNodes.forEach(walk)}
const MO={childList:true,subtree:true,characterData:true};
const mo=new MutationObserver(ms=>{if(LANG==='ar')return;mo.disconnect();ms.forEach(m=>m.type==='characterData'?walk(m.target):m.addedNodes.forEach(walk));mo.observe(document.body,MO)});

function pmode(){sheet(`<h2 style="margin-top:0">وضع الحرفي (تجريبي)</h2><p class="mut" style="margin-bottom:8px">اختر الحرفي الذي تريد تجربة لوحته. تظهر هنا الحجوزات المسجلة على هذا الجهاز.</p><select class="in" id="pmx">${P.map(p=>`<option value="${p.id}">${CI[p.c][2]} ${esc(p.n)}</option>`).join('')}</select><button class="btn" onclick="S.pm=+$('pmx').value;S.pmu=1;save();closeS();location.hash='#/dash'">فتح لوحة الحرفي</button>`)}
function route(){const[a,b]=(location.hash||'#/').slice(2).split('/'),pg={c:()=>cat(b),p:()=>prof(+b),b:()=>book(+b),orders,fav:favs,me,dash}[a]||home;

}
