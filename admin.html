<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة حرفي</title>
<style>body{font-family:Tahoma,Arial,sans-serif;background:#0f1020;color:#eee;margin:0;padding:16px;max-width:560px;margin:auto}input,button{font:inherit;padding:12px;border-radius:12px;border:0;width:100%;box-sizing:border-box;margin-top:8px}input{background:#1b1c36;color:#fff}button{background:#4f46e5;color:#fff;font-weight:700;cursor:pointer}.c{background:#1b1c36;border-radius:16px;padding:14px;margin-top:12px}.r{display:flex;gap:8px}.r button{margin-top:10px}.no{background:#ef4444}.m{color:#a5a7c9;font-size:14px}.b{display:inline-block;padding:2px 10px;border-radius:20px;background:#333659;font-size:13px}</style></head><body>
<h2>🛠️ إدارة طلبات الانضمام</h2>
<div id="lg"><input id="pw" type="password" placeholder="كلمة سر الإدارة"><button onclick="go()">دخول</button></div>
<div id="ls"></div><div id="er" class="m"></div>
<script>
const U='https://gbqchrrupcwzxbutbmbd.supabase.co',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdicWNocnJ1cGN3enhidXRibWJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MzY4NzYsImV4cCI6MjEwODAxMjg3Nn0.-wMcO94AU7wkKBjsXY6_qnwWd4ez2OfNPs4IyQW74Ww';
const CT={plumb:'سباكة',elec:'كهرباء',clean:'تنظيف',paint:'دهان',wood:'نجارة',ac:'تكييف',weld:'حدادة',furn:'تركيب أثاث',pest:'مكافحة حشرات',move:'نقل أثاث',garden:'بستنة',appl:'صيانة أجهزة'};
const ST={pending:'بانتظار القرار',approved:'مقبول',rejected:'مرفوض'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let PW='';
async function rpc(f,b){const r=await fetch(U+'/rest/v1/rpc/'+f,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify(b)});const t=await r.text();if(!r.ok)throw new Error(t.includes('bad password')?'كلمة السر خاطئة':'خطأ '+r.status);return t?JSON.parse(t):null}
async function go(){PW=document.getElementById('pw').value;load()}
async function load(){er.textContent='';try{const L=await rpc('admin_list',{pw:PW});lg.style.display='none';ls.innerHTML=L.length?L.map(q=>'<div class="c"><b>'+esc(q.n)+'</b> <span class="b">'+ST[q.st]+'</span><div class="m">'+(CT[q.c]||esc(q.c))+' · 📞 <a style="color:#9aa0ff" href="tel:'+esc(q.ph)+'">'+esc(q.ph)+'</a><br>'+new Date(+q.cr).toLocaleString('ar-DZ')+'</div>'+(q.st==='pending'?'<div class="r"><button onclick="dc('+q.id+',true)">قبول</button><button class="no" onclick="dc('+q.id+',false)">رفض</button></div>':'')+'</div>').join(''):'<div class="c m">لا توجد طلبات بعد.</div>'}catch(e){er.textContent=e.message}}
async function dc(id,ok){if(!confirm(ok?'قبول هذا الحرفي؟':'رفض الطلب؟'))return;try{await rpc('admin_decide',{pw:PW,rid:id,ok});load()}catch(e){er.textContent=e.message}}
</script></body></html>
